name: neuralnexus-api-test

services:
  test-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: neuralnexus
      POSTGRES_PASSWORD: neuralnexus
    ports:
      - "55432:5432"
    volumes:
      - ../db:/db:ro
      - ./testdb/load-databases.sh:/docker-entrypoint-initdb.d/load-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralnexus -d neuralnexus"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-redis:
    image: valkey/valkey:8.1.1
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
